<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <!-- Main background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0f0c29"/>
      <stop offset="50%"  stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>

    <!-- Glow effect for text -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle radial highlight -->
    <radialGradient id="highlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f0c29" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)"/>

  <!-- Radial highlight overlay -->
  <rect width="900" height="200" fill="url(#highlight)"/>

  <!-- Decorative circles -->
  <circle cx="60"  cy="40"  r="80"  fill="#7C3AED" opacity="0.07"/>
  <circle cx="840" cy="160" r="100" fill="#A78BFA" opacity="0.06"/>
  <circle cx="450" cy="10"  r="120" fill="#4C1D95" opacity="0.05"/>

  <!-- Bottom wave -->
  <path d="M0,165 C100,150 200,175 300,160 C400,145 500,175 600,162 C700,149 800,172 900,158 L900,200 L0,200 Z"
        fill="#A78BFA" opacity="0.08"/>
  <path d="M0,178 C120,165 240,185 360,172 C480,159 600,182 720,170 C810,160 870,178 900,172 L900,200 L0,200 Z"
        fill="#7C3AED" opacity="0.12"/>

  <!-- Dot grid decoration (left) -->
  <g opacity="0.12" fill="#A78BFA">
    <circle cx="22" cy="80"  r="2"/><circle cx="38" cy="80"  r="2"/><circle cx="54" cy="80"  r="2"/>
    <circle cx="22" cy="96"  r="2"/><circle cx="38" cy="96"  r="2"/><circle cx="54" cy="96"  r="2"/>
    <circle cx="22" cy="112" r="2"/><circle cx="38" cy="112" r="2"/><circle cx="54" cy="112" r="2"/>
    <circle cx="22" cy="128" r="2"/><circle cx="38" cy="128" r="2"/><circle cx="54" cy="128" r="2"/>
  </g>

  <!-- Dot grid decoration (right) -->
  <g opacity="0.12" fill="#A78BFA">
    <circle cx="846" cy="60"  r="2"/><circle cx="862" cy="60"  r="2"/><circle cx="878" cy="60"  r="2"/>
    <circle cx="846" cy="76"  r="2"/><circle cx="862" cy="76"  r="2"/><circle cx="878" cy="76"  r="2"/>
    <circle cx="846" cy="92"  r="2"/><circle cx="862" cy="92"  r="2"/><circle cx="878" cy="92"  r="2"/>
    <circle cx="846" cy="108" r="2"/><circle cx="862" cy="108" r="2"/><circle cx="878" cy="108" r="2"/>
  </g>

  <!-- AI bracket decorations -->
  <text x="130" y="108" font-family="JetBrains Mono, Courier New, monospace" font-size="40" fill="#4C1D95" opacity="0.4" text-anchor="middle">{</text>
  <text x="770" y="108" font-family="JetBrains Mono, Courier New, monospace" font-size="40" fill="#4C1D95" opacity="0.4" text-anchor="middle">}</text>

  <!-- Purple accent line above name -->
  <rect x="370" y="58" width="160" height="2" rx="1" fill="#A78BFA" opacity="0.6"/>

  <!-- Main name -->
  <text x="450" y="102"
        font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="42" font-weight="700"
        fill="white"
        text-anchor="middle"
        filter="url(#glow)">Aditya Sharma</text>

  <!-- Subtitle -->
  <text x="450" y="136"
        font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="16" font-weight="400" letter-spacing="1.5"
        fill="#C4B5FD"
        text-anchor="middle">AI / ML Engineer  ·  GenAI  ·  Agentic Systems Builder</text>

  <!-- Purple accent line below subtitle -->
  <rect x="370" y="148" width="160" height="2" rx="1" fill="#A78BFA" opacity="0.6"/>
</svg>
